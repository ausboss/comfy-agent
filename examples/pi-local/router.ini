; llama.cpp router presets for the M1 handoff runs. Start with ./start-router.sh.
; Paths are filled in by start-router.sh from MODELS (default ~/models/pi-local).
version = 1

[*]
c = 32768
n-gpu-layers = 999
jinja = true
; one parallel slot: the whole 32K context belongs to Pi's one conversation
parallel = 1

[qwen38-27b]
model = ${MODELS}/Qwen3.8-27B-UD-Q3_K_XL/Qwen3.8-27B-UD-Q3_K_XL.gguf
mmproj = ${MODELS}/Qwen3.8-27B-UD-Q3_K_XL/mmproj-F16.gguf
